<!doctype html>
<!--
  Fuente de client/public/og-image.png, la imagen de vista previa que muestran
  WhatsApp, Facebook, etc. al compartir el link de la agenda (las etiquetas
  og:/twitter: de client/index.html). No es parte de la app: se renderiza a
  mano con Chrome headless y se commitea el PNG. Para regenerarla, desde la raíz:

    "C:/Program Files/Google/Chrome/Application/chrome.exe" --headless=new \
      --hide-scrollbars --window-size=1200,630 --virtual-time-budget=5000 \
      --screenshot="$PWD/client/public/og-image.png" "file:///$PWD/docs/og-image.html"

  Si cambia la imagen, cambiá también el nombre (og-image-2.png…) en index.html:
  WhatsApp y Facebook guardan la vista previa de una URL de imagen por días.
-->
<html lang="es">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500;6..96,600&family=Instrument+Sans:wght@500;600;700&display=swap" />
<style>
  :root {
    --paper: #F5F3EA; --ink: #1A2320; --ink-soft: #565F58; --ink-faint: #8C948C;
    --forest: #1E4634; --forest-2: #163527; --forest-ink: #F2EFE4;
    --ini: #C0392F; --pri: #2C8148; --sec: #2A64B8; --ins: #C87C0A; --per: #6F4A9B; --fer: #A62B2B;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: 'Instrument Sans', system-ui, sans-serif;
    background: linear-gradient(160deg, var(--forest) 0%, var(--forest-2) 100%);
    color: var(--forest-ink);
    display: grid;
    grid-template-columns: 1fr 470px;
    gap: 56px;
    padding: 64px 72px;
    position: relative;
  }
  /* Franja con los colores de los niveles, como un lomo de agenda. */
  body::after {
    content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 12px;
    background: linear-gradient(90deg,
      var(--ini) 0 20%, var(--pri) 20% 40%, var(--sec) 40% 60%, var(--ins) 60% 80%, var(--per) 80% 100%);
  }
  .txt { display: flex; flex-direction: column; justify-content: center; }
  .kicker {
    font-size: 19px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase;
    opacity: .75; margin-bottom: 22px;
  }
  h1 {
    font-family: 'Bodoni Moda', Georgia, serif; font-weight: 500;
    font-size: 104px; line-height: .95; margin: 0 0 30px;
  }
  .bajada { font-size: 29px; line-height: 1.32; margin: 0; opacity: .92; max-width: 560px; }
  .url {
    margin-top: 34px; font-size: 22px; font-weight: 600; letter-spacing: .02em;
    display: inline-flex; align-items: center; gap: 12px; opacity: .85;
  }
  .url::before { content: ''; width: 34px; height: 2px; background: currentColor; }

  .card {
    align-self: center;
    background: var(--paper); color: var(--ink);
    border-radius: 18px; padding: 30px 32px 26px;
    box-shadow: 0 30px 60px rgba(0,0,0,.35);
    transform: rotate(1.5deg);
  }
  .card-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 16px; }
  .card-head h2 { font-family: 'Bodoni Moda', Georgia, serif; font-weight: 500; font-size: 40px; margin: 0; }
  .card-head span { font-size: 16px; color: var(--ink-soft); font-weight: 600; }
  .dow, .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .dow span { text-align: center; font-size: 14px; font-weight: 700; color: var(--ink-faint); padding-bottom: 6px; }
  .cell {
    height: 46px; border-radius: 8px; font-size: 17px; font-weight: 600;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  }
  .cell.out { color: #C3C6BC; }
  .cell.today { background: var(--forest); color: var(--forest-ink); }
  .cell.fer { background: var(--fer); color: #FFF3F0; }
  .pips { display: flex; gap: 3px; height: 6px; }
  .pip { width: 6px; height: 6px; border-radius: 50%; }
  .legend { display: flex; justify-content: space-between; margin-top: 18px; font-size: 13.5px; font-weight: 600; color: var(--ink-soft); }
  .legend span { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
  .legend i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
</style>
</head>
<body>
  <div class="txt">
    <div class="kicker">Colegio San Gabriel · 2026</div>
    <h1>Agenda escolar</h1>
    <p class="bajada">Todas las fechas del colegio, filtradas por sala y grado. Sumá tus propios eventos y recibí un aviso el día antes.</p>
    <div class="url">agenda-colegio.leviatas.com</div>
  </div>

  <div class="card">
    <div class="card-head"><h2>Noviembre</h2><span>2026</span></div>
    <div class="dow"><span>L</span><span>M</span><span>M</span><span>J</span><span>V</span><span>S</span><span>D</span></div>
    <div class="grid" id="grid"></div>
    <div class="legend">
      <span><i style="background:var(--ini)"></i>Inicial</span>
      <span><i style="background:var(--pri)"></i>Primaria</span>
      <span><i style="background:var(--sec)"></i>Secundaria</span>
      <span><i style="background:var(--ins)"></i>Institucional</span>
      <span><i style="background:var(--per)"></i>Personal</span>
    </div>
  </div>

<script>
  // Grilla ilustrativa (no son los eventos reales): noviembre 2026 arranca en domingo.
  const pips = { 3: ['pri'], 5: ['ini', 'sec'], 9: ['ins'], 11: ['pri', 'per'], 13: ['sec'],
    17: ['ini', 'pri'], 19: ['per'], 24: ['sec', 'ins'], 26: ['pri'], 27: ['ini', 'per'] };
  const grid = document.getElementById('grid');
  const add = (n, cls, lv = []) => {
    const c = document.createElement('div');
    c.className = 'cell ' + cls;
    c.innerHTML = `<span>${n}</span><span class="pips">${lv.map((l) => `<i class="pip" style="background:var(--${l})"></i>`).join('')}</span>`;
    grid.appendChild(c);
  };
  for (let d = 26; d <= 31; d++) add(d, 'out');
  for (let d = 1; d <= 30; d++) add(d, d === 18 ? 'today' : d === 23 ? 'fer' : '', pips[d]);
  for (let d = 1; d <= 6; d++) add(d, 'out');
</script>
</body>
</html>
