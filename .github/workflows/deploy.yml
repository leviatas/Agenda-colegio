name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # cancel-in-progress: false a propósito — dos pushes seguidos hacen dos
  # deploys en fila, nunca dos `docker compose up --build` pisándose.
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 40 # los builds en ARM son lentos
    steps:
      # Sin checkout a propósito: se trabaja sobre el clon que ya vive en
      # DEPLOY_DIR, que es el que tiene el .env con los secretos (ese .env no
      # está en el repo y hay que crearlo a mano la primera vez).
      - name: Deploy con deploy.sh (hasta 3 intentos)
        run: |
          DEPLOY_DIR="${{ vars.DEPLOY_DIR }}"
          DEPLOY_DIR="${DEPLOY_DIR:-$HOME/proyectos/sanga/Agenda-colegio}"
          if [ ! -d "$DEPLOY_DIR/.git" ]; then
            echo "::error::No existe un repo git en $DEPLOY_DIR. Configurá la variable DEPLOY_DIR en GitHub (Settings → Secrets and variables → Actions → Variables)."
            exit 1
          fi
          cd "$DEPLOY_DIR"
          chmod +x ./deploy.sh

          max_intentos=3
          intento=1
          until ./deploy.sh; do
            if [ "$intento" -ge "$max_intentos" ]; then
              echo "::error::deploy.sh falló $max_intentos veces seguidas. Abortando."
              exit 1
            fi
            echo "::warning::Intento $intento falló. Reintentando en 10 segundos… (quedan $((max_intentos - intento)) reintentos)"
            intento=$((intento + 1))
            sleep 10
          done
