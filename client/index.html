<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agenda San Gabriel</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Vista previa al compartir el link (WhatsApp, Facebook, Telegram, X…).
         Los robots que la leen no corren JavaScript: tiene que estar acá, en el
         HTML estático, y con URLs absolutas. La imagen sale de
         docs/og-image.html (ahí dice cómo regenerarla). -->
    <meta name="description" content="El calendario del Colegio San Gabriel, filtrado por sala y grado. Sumá tus propios eventos y recibí un aviso el día antes." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_AR" />
    <meta property="og:site_name" content="Agenda San Gabriel" />
    <meta property="og:url" content="https://agenda-colegio.leviatas.com/" />
    <meta property="og:title" content="Agenda escolar · Colegio San Gabriel 2026" />
    <meta property="og:description" content="Todas las fechas del colegio, filtradas por sala y grado. Sumá tus propios eventos y recibí un aviso el día antes." />
    <meta property="og:image" content="https://agenda-colegio.leviatas.com/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Agenda escolar del Colegio San Gabriel: un calendario de noviembre con los eventos marcados por nivel." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Agenda escolar · Colegio San Gabriel 2026" />
    <meta name="twitter:description" content="Todas las fechas del colegio, filtradas por sala y grado. Sumá tus propios eventos y recibí un aviso el día antes." />
    <meta name="twitter:image" content="https://agenda-colegio.leviatas.com/og-image.png" />
    <script>
      // Aplica el tema guardado antes de que React monte, para que no haya un
      // flash de tema claro en el primer paint. 'system' no setea nada: el CSS
      // resuelve solo con prefers-color-scheme (ver components/ThemeSwitch).
      (function () {
        try {
          var v = localStorage.getItem('sg-tema');
          if (v === 'light' || v === 'dark') document.documentElement.setAttribute('data-theme', v);
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500;6..96,600;6..96,700&family=Instrument+Sans:wght@400;500;600;700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
