server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Si la app sube archivos, subí este límite: el default de nginx es 1 MB y
    # un upload más grande muere con un 413 sin llegar al server.
    client_max_body_size 25m;

    # Proxy al backend: desde el browser es same-origin, así que no se dispara
    # ningún preflight de CORS. "server" es el nombre del servicio en la red de
    # Compose, no localhost.
    location /api/ {
        proxy_pass http://server:4000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Fallback de SPA para el routing del lado del cliente.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
